services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dblapoge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.docker.example)}
    # Só expõe a porta do Postgres ao host local (127.0.0.1). Em uma
    # instalação com acesso remoto, o banco NÃO deve ficar acessível pela
    # rede externa — apenas a API (porta 3001) precisa ser exposta.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dblapoge_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend/local-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/dblapoge
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env, gerado com openssl rand -hex 32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080/reset-password}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@local.test}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Defina INITIAL_ADMIN_PASSWORD no arquivo .env}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador Local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-DBLAPOGE <no-reply@localhost>}
    # Só acessível pelo host local e por outros containers desta rede
    # (o Caddy do docker-compose.remote.yml chega na API via rede interna
    # do Docker mesmo com a porta publicada só em 127.0.0.1). Isso evita
    # que a API fique diretamente exposta pela rede externa sem TLS.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - postgres

volumes:
  dblapoge_pgdata:
