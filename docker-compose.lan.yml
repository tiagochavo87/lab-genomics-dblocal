# Overlay para uso SÓ na rede interna, sem domínio e sem HTTPS:
#   docker compose -f docker-compose.local.yml -f docker-compose.lan.yml up -d --build
# O Caddy serve o frontend e a API em http://IP-DO-SERVIDOR:8080.
# Atenção: sem HTTPS o tráfego não é criptografado. Para acesso pela
# internet use o docker-compose.remote.yml (HTTPS automático).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      DOMAIN: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - api
  api:
    environment:
      TRUST_PROXY: "1"
      HTTPS: "false"
