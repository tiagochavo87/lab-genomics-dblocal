# Overlay para acesso remoto com HTTPS automático (Caddy + Let's Encrypt).
#   docker compose -f docker-compose.local.yml -f docker-compose.remote.yml up -d --build
# Só o Caddy expõe portas (80/443). API e Postgres continuam internos.
services:
  api:
    environment:
      # A API fica atrás do Caddy: confia em 1 proxy para obter o IP real
      # (rate limit e auditoria) e ativa HSTS/upgrade-insecure-requests.
      TRUST_PROXY: "1"
      HTTPS: "true"
      CORS_ORIGIN: https://${DOMAIN:-localhost}
      PUBLIC_APP_URL: https://${DOMAIN:-localhost}/reset-password

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
